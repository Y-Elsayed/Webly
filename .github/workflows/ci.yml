name: CI

on:
  push:
  pull_request:

jobs:
  single-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build installed Core check image
        run: docker build --target checks -t webly-checks:ci .
      - name: Prepare writable evidence directory
        run: mkdir -p host-evidence && chmod 777 host-evidence
      - name: Check process recovery, contention and actual disk exhaustion
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777 --tmpfs /app/log:mode=1777
          --tmpfs /limited:size=1m,mode=1777 -e OMP_NUM_THREADS=1
          -v "$PWD/host-evidence:/evidence" webly-checks:ci
          python -m scripts.single_host_checks --small-fs /limited --output /evidence/process-checks.json
      - name: Test installed Core contracts
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777 --tmpfs /app/log:mode=1777 -e OMP_NUM_THREADS=1
          webly-checks:ci python -m pytest tests -q -p no:cacheprovider
      - name: Benchmark smoke without model calls
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:mode=1777 --tmpfs /app/log:mode=1777 -e OMP_NUM_THREADS=1
          -v "$PWD/host-evidence:/evidence" webly-checks:ci
          python -m scripts.benchmark_core --pages 100 --segments-per-page 10
          --dimensions 1536 --queries 10 --output /evidence/benchmark-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-host-evidence
          path: host-evidence/*.json

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development and explicit API/UI dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run required tests
        run: python -m pytest -ra

  installed-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools only
        run: python -m pip install "setuptools>=68" wheel twine
      - name: Verify Core-only wheels, then optional API/UI and required service tests
        run: python scripts/verify_core_package.py --work-dir package-verification --extras --audit
      - name: Validate wheel metadata
        run: python -m twine check package-verification/wheels/*.whl
      - name: Upload package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-package-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            package-verification/verification.json
            package-verification/wheels/*.whl
            package-verification/profiles/*
