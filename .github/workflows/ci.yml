name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development and explicit API/UI dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run required tests
        run: python -m pytest -ra

  installed-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools only
        run: python -m pip install "setuptools>=68" wheel twine
      - name: Verify Core-only wheels, then optional API/UI and required service tests
        run: python scripts/verify_core_package.py --work-dir package-verification --extras
      - name: Validate wheel metadata
        run: python -m twine check package-verification/wheels/*.whl
      - name: Upload package verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-package-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            package-verification/verification.json
            package-verification/wheels/*.whl
